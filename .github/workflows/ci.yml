# .github/workflows/ci.yml
# CI/CD Pipeline
# Automated testing, linting, and deployment

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

env:
  RUBY_VERSION: '3.2.0'
  GO_VERSION: '1.26'
  NODE_VERSION: '18'

jobs:
  # ============================================================================
  # Linting
  # ============================================================================

  rubocop:
    name: RuboCop Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./rails-backend

      - name: Run RuboCop
        working-directory: ./rails-backend
        run: bundle exec rubocop --parallel

  go-lint:
    name: Go Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./go-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: ./go-backend
          args: --timeout=5m

  eslint:
    name: ESLint Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./react-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

  # ============================================================================
  # Testing
  # ============================================================================

  rspec-tests:
    name: RSpec Tests
    runs-on: ubuntu-latest
    needs: [rubocop]
    defaults:
      run:
        working-directory: ./rails-backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: oo_parking_lot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./rails-backend

      - name: Setup database
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
        run: |
          bundle exec rails db:create
          bundle exec rails db:test:prepare

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
        run: bundle exec rspec --format documentation --format RspecJunitFormatter --out rspec-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-results
          path: rails-backend/rspec-results.xml

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: rails-backend/rspec-results.xml
          check_name: RSpec Test Results

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: [go-lint]
    defaults:
      run:
        working-directory: ./go-backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: oo_parking_lot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Setup test databases
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
        run: |
          echo "Setting up test databases..."
          go run cmd/test-setup/main.go
          echo "Test database setup completed"
          sleep 2  # Give databases time to be fully ready

      - name: Run tests
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: oo_parking_lot_test
          REDIS_URL: redis://localhost:6379/0
          TZ: UTC
          GOFLAGS: -mod=readonly
          CGO_ENABLED: 1
        run: |
          echo "Running Go tests with race detector and coverage..."
          set -o pipefail
          go test -v -race -timeout=5m -coverprofile=coverage.out -covermode=atomic -json ./... 2>&1 | tee go-test-results.json
          TEST_EXIT_CODE=$?
          echo "Test exit code: $TEST_EXIT_CODE"

          # Parse test results
          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "✓ All tests passed!"
            # Count test results
            PASSED=$(grep -c '"Action":"pass"' go-test-results.json || true)
            SKIPPED=$(grep -c '"Action":"skip"' go-test-results.json || true)
            echo "Tests passed: $PASSED"
            [ $SKIPPED -gt 0 ] && echo "Tests skipped: $SKIPPED"
          else
            echo "✗ Tests failed with exit code $TEST_EXIT_CODE"
            # Show failures
            grep '"Action":"fail"' go-test-results.json || true
          fi

          exit $TEST_EXIT_CODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-results
          path: go-backend/go-test-results.json

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: go-backend/coverage.out
          flags: go-backend
          fail_ci_if_error: false

      - name: Generate test report
        if: always()
        working-directory: ./go-backend
        run: |
          echo "## Go Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if tests passed
          if grep -q '"Action":"fail"' go-test-results.json 2>/dev/null; then
            echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Statistics" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(grep -c '"Action":"run"' go-test-results.json 2>/dev/null || echo "0")
          PASSED=$(grep -c '"Action":"pass"' go-test-results.json 2>/dev/null || echo "0")
          SKIPPED=$(grep -c '"Action":"skip"' go-test-results.json 2>/dev/null || echo "0")

          echo "- Total tests: $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- Passed: $PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- Skipped: $SKIPPED" >> $GITHUB_STEP_SUMMARY

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [eslint]
    defaults:
      run:
        working-directory: ./react-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: react-web/test-results.json

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: react-web/coverage/coverage-final.json
          flags: react-web

  playwright-e2e-tests:
    name: Playwright E2E Tests (Chromium Only) - Shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    needs: [eslint]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: oo_parking_lot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: ./react-web
        run: bun install

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go-backend/go.sum

      - name: Install Playwright Browsers
        working-directory: ./react-web
        run: bunx playwright install --with-deps chromium

      - name: Setup Go backend database
        working-directory: ./go-backend
        run: |
          go mod download
          psql "postgresql://postgres:postgres@localhost:5432/oo_parking_lot_test?sslmode=disable" -f scripts/init-db.sql

      - name: Build and start Go backend
        working-directory: ./go-backend
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: oo_parking_lot_test
          REDIS_URL: redis://localhost:6379/0
          TZ: UTC
          CGO_ENABLED: 0
        run: |
          go build -a -installsuffix cgo -o main ./cmd/server/main.go
          ./main > /tmp/go-server.log 2>&1 &

      - name: Wait for Go backend to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8082/health; then
              echo "Go backend is ready"
              break
            fi
            echo "Waiting for Go backend... ($i/30)"
            sleep 2
          done

      - name: Initialize database with test data
        run: |
          INIT_DATA='{
            "entry_points": [
              {"identifier": "A", "name": "Entry Point A"},
              {"identifier": "B", "name": "Entry Point B"},
              {"identifier": "C", "name": "Entry Point C"}
            ],
            "parking_slots": [
              {"slot_label": "SP-1", "slot_type": "SP", "distances": [5,  15, 25]},
              {"slot_label": "SP-2", "slot_type": "SP", "distances": [10, 5,  15]},
              {"slot_label": "SP-3", "slot_type": "SP", "distances": [15, 5,  5]},
              {"slot_label": "MP-1", "slot_type": "MP", "distances": [10, 10, 20]},
              {"slot_label": "MP-2", "slot_type": "MP", "distances": [20, 10, 10]},
              {"slot_label": "LP-1", "slot_type": "LP", "distances": [15, 15, 15]},
              {"slot_label": "LP-2", "slot_type": "LP", "distances": [2,  5,  6]}
            ]
          }'
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$INIT_DATA" \
            "http://localhost:8082/api/v1/initialize"

      - name: Run Playwright E2E tests (Shard ${{ matrix.shard }}/3)
        working-directory: ./react-web
        env:
          CI: true
          API_BASE_URL: http://127.0.0.1:8082
          VITE_API_BASE_URL: http://127.0.0.1:8082/api/v1
        run: bunx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: |
            react-web/playwright-report/
            react-web/test-results.json

      - name: Upload Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-shard-${{ matrix.shard }}
          path: react-web/test-results/
          retention-days: 7

      - name: Upload Go server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-server-logs-shard-${{ matrix.shard }}
          path: /tmp/go-server.log
          retention-days: 7

  playwright-e2e-tests-consolidate:
    name: Consolidate Playwright Test Results
    runs-on: ubuntu-latest
    needs: [playwright-e2e-tests]
    if: always()

    steps:
      - name: Download Playwright shard results
        uses: actions/download-artifact@v4
        with:
          path: test-results
          pattern: playwright-test-results-shard-*
          merge-multiple: false

      - name: Check test results
        run: |
          echo "Downloaded Playwright test results:"
          if find test-results -name "test-results.json" -type f | grep -q .; then
            find test-results -name "test-results.json" -type f | while read file; do
              echo "Found: $file"
            done
          else
            echo "No test-results.json files found (shards may have had no results)"
          fi

      - name: Upload consolidated results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-consolidated
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  detox-e2e-tests:
    name: Detox E2E Tests (iOS)
    runs-on: macos-latest
    needs: [eslint]
    defaults:
      run:
        working-directory: ./react-native-mobile
    strategy:
      fail-fast: false
      matrix:
        test-group: [core, management, simple-navigation]
    env:
      TEST_GROUP: ${{ matrix.test-group }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Set up Detox CLI
        run: npm install -g detox-cli

      - name: Fix CocoaPods boost checksum issue and install pods
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          # Update pod repo first
          echo "Updating CocoaPods repository..."
          pod repo update

          # The Podfile now includes a patch to fix the boost checksum issue
          # This will automatically patch the boost podspec before installation
          echo "Installing CocoaPods dependencies (may take a few minutes)..."
          pod install 2>&1 | tee pod_install.log

          # Check installation status
          if [ -f "Pods/Manifest.lock" ]; then
            echo "✅ Pod installation successful"
          else
            echo "⚠️  Pod installation completed with warnings"
            cat pod_install.log
          fi
          cd ..

      - name: Build Detox iOS configuration
        continue-on-error: true
        run: detox build --configuration ios.sim.debug

      - name: Run Detox E2E tests - Core Flows
        if: matrix.test-group == 'core'
        continue-on-error: true
        run: detox test e2e/tests/core --configuration ios.sim.debug --cleanup

      - name: Run Detox E2E tests - Management
        if: matrix.test-group == 'management'
        continue-on-error: true
        run: detox test e2e/tests/management --configuration ios.sim.debug --cleanup

      - name: Run Detox E2E tests - Simple Navigation
        if: matrix.test-group == 'simple-navigation'
        continue-on-error: true
        run: detox test e2e/tests/simple e2e/tests/navigation e2e/tests/system --configuration ios.sim.debug --cleanup

      - name: Upload Detox test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: detox-test-results-${{ matrix.test-group }}
          path: react-native-mobile/artifacts/
          retention-days: 7

  # ============================================================================
  # Build
  # ============================================================================

  build-rails:
    name: Build Rails
    runs-on: ubuntu-latest
    needs: [rspec-tests]
    defaults:
      run:
        working-directory: ./rails-backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: oo_parking_lot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./rails-backend

      - name: Setup database
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
        run: |
          bundle exec rails db:create
          bundle exec rails db:test:prepare

      - name: Verify application builds
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
        run: bundle exec rails runner "puts 'Rails application builds successfully'"

  build-go:
    name: Build Go
    runs-on: ubuntu-latest
    needs: [go-tests]
    defaults:
      run:
        working-directory: ./go-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go-backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build -a -installsuffix cgo -o main ./cmd/server/main.go

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-build
          path: go-backend/main

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [frontend-tests, playwright-e2e-tests-consolidate, detox-e2e-tests]
    defaults:
      run:
        working-directory: ./react-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: react-web/dist

  # ============================================================================
  # Security Scanning
  # ============================================================================

  brakeman-scan:
    name: Brakeman Security Scan (Rails)
    runs-on: ubuntu-latest
    needs: [rubocop]
    defaults:
      run:
        working-directory: ./rails-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./rails-backend

      - name: Install Brakeman
        run: gem install brakeman

      - name: Run Brakeman
        run: brakeman --no-pager --no-exit-on-warn --format json --output brakeman-results.json

      - name: Upload Brakeman results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brakeman-results
          path: rails-backend/brakeman-results.json

  bundler-audit:
    name: Bundler Audit (Rails)
    runs-on: ubuntu-latest
    needs: [rubocop]
    defaults:
      run:
        working-directory: ./rails-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./rails-backend

      - name: Install Bundler-Audit
        run: gem install bundler-audit

      - name: Run Bundler-Audit
        run: bundler-audit check --update
        continue-on-error: true

  npm-audit:
    name: NPM Audit (React Web)
    runs-on: ubuntu-latest
    needs: [eslint]
    defaults:
      run:
        working-directory: ./react-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run NPM Audit
        run: bun audit
        continue-on-error: true

  gosec:
    name: GoSec Security Scan (Go)
    runs-on: ubuntu-latest
    needs: [go-lint]
    defaults:
      run:
        working-directory: ./go-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run GoSec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif -verbose=text -stdout ./...'

      - name: Upload GoSec results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-results
          path: go-backend/gosec-results.sarif
          retention-days: 30

      - name: Upload GoSec results to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'go-backend/gosec-results.sarif'
          category: gosec

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-rails, build-go, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # Cross-Backend E2E Testing (Newman)
  # ============================================================================

  newman-ruby-tests:
    name: Newman Tests (Ruby Backend)
    runs-on: ubuntu-latest
    needs: [rubocop]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: oo_parking_lot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./rails-backend

      - name: Setup database
        working-directory: ./rails-backend
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
        run: |
          bundle exec rails db:create
          bundle exec rails db:test:prepare

      - name: Start Ruby server
        working-directory: ./rails-backend
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
        run: bundle exec rails server -p 3000 -b 0.0.0.0 > /tmp/ruby-server.log 2>&1 &

      - name: Wait for Ruby server to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Rails backend is ready"
              break
            fi
            echo "Waiting for Rails backend... ($i/30)"
            sleep 2
          done
          # Final check
          curl -sf http://localhost:3000/health > /dev/null || (echo "Rails backend failed to start" && cat /tmp/ruby-server.log && exit 1)

      - name: Initialize database with test data
        run: |
          INIT_DATA='{
            "entry_points": [
              {"identifier": "A", "name": "Entry Point A"},
              {"identifier": "B", "name": "Entry Point B"},
              {"identifier": "C", "name": "Entry Point C"}
            ],
            "parking_slots": [
              {"slot_label": "SP-1", "slot_type": "SP", "distances": [5,  15, 25]},
              {"slot_label": "SP-2", "slot_type": "SP", "distances": [10, 5,  15]},
              {"slot_label": "SP-3", "slot_type": "SP", "distances": [15, 5,  5]},
              {"slot_label": "MP-1", "slot_type": "MP", "distances": [10, 10, 20]},
              {"slot_label": "MP-2", "slot_type": "MP", "distances": [20, 10, 10]},
              {"slot_label": "LP-1", "slot_type": "LP", "distances": [15, 15, 15]},
              {"slot_label": "LP-2", "slot_type": "LP", "distances": [2,  5,  6]}
            ]
          }'
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$INIT_DATA" \
            "http://localhost:3000/api/v1/initialize")
          echo "Init response: $RESPONSE"
          SUCCESS=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('success', False))" 2>/dev/null || echo "false")
          if [ "$SUCCESS" != "True" ] && [ "$SUCCESS" != "true" ]; then
            echo "Database initialization failed"
            exit 1
          fi

      - name: Create active session for delete-slot test
        run: |
          PARK_RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"vehicle_type": "S", "entry_point_id": "A"}' \
            "http://localhost:3000/api/v1/sessions")
          echo "Park response: $PARK_RESPONSE"
          SLOT_ID=$(echo "$PARK_RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin).get('data', {}); print(d.get('parking_slot', {}).get('id', ''))" 2>/dev/null || echo "")
          if [ -n "$SLOT_ID" ]; then
            # Update env file with active_slot_id inside values array
            python3 -c "
          import json
          with open('newman-env-ci-ruby.json') as f:
              data = json.load(f)
          for v in data.get('values', []):
              if v.get('key') == 'active_slot_id':
                  v['value'] = '$SLOT_ID'
                  break
          with open('newman-env-ci-ruby.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
            echo "Saved active_slot_id=$SLOT_ID to env file"
          else
            echo "Warning: Failed to create active session, delete-slot test may fail"
          fi

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman tests
        run: |
          newman run "Parking Lot API.postman_collection.json" \
            -e newman-env-ci-ruby.json \
            --reporters cli,json \
            --reporter-json-export newman-ruby-results.json

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-ruby-results
          path: newman-ruby-results.json

      - name: Upload Ruby server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-server-logs
          path: /tmp/ruby-server.log
          retention-days: 7

      - name: Check for test failures
        if: always()
        run: |
          if [ -f newman-ruby-results.json ]; then
            python3 -c "
          import sys, json
          with open('newman-ruby-results.json') as f:
              data = json.load(f)
          failures = [r for r in data.get('run', {}).get('executions', []) if r.get('failures', [])]
          if failures:
              for f in failures:
                  for e in f.get('failures', []):
                      print(f\"FAIL: {f.get('item', {}).get('name', 'unknown')}: {e.get('error', {}).get('message', 'unknown error')}\")
              sys.exit(1)
          print('All Newman tests passed')
          "
          fi

