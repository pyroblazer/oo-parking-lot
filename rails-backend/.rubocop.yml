# RuboCop Configuration for OO Parking Lot
# Relaxed defaults - enables key cops without being overly strict

plugins:
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.4
  Exclude:
    - 'vendor/**/*'
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'log/**/*'
    - 'storage/**/*'
    - 'coverage/**/*'
    - 'restore_unpark_json.rb'

# --- Disabled overly strict cops ---

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

# --- Metrics disabled (would require extensive refactoring) ---

Metrics/AbcSize:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false

# --- Layout ---

Layout/LineLength:
  Max: 150
  Exclude:
    - 'db/schema.rb'

# --- Style relaxations ---

Style/GlobalVars:
  AllowedVariables:
    - '$parking_metrics'

Style/ComparableClamp:
  Enabled: false
Style/RedundantConstantBase:
  Enabled: false
Style/FetchEnvVar:
  Enabled: false
Style/ArgumentsForwarding:
  Enabled: false

# --- Naming ---

Naming/AccessorMethodName:
  Enabled: false

# --- Lint relaxations ---

Lint/UnusedMethodArgument:
  Enabled: false
Lint/RedundantDirGlobSort:
  Enabled: false
Lint/AmbiguousOperatorPrecedence:
  Enabled: false

# --- RSpec ---

RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/MultipleMemoizedHelpers:
  Enabled: false
RSpec/NamedSubject:
  Enabled: false
RSpec/InstanceVariable:
  Enabled: false
RSpec/ContextWording:
  Enabled: false
RSpec/RepeatedExample:
  Enabled: false
RSpec/MessageSpies:
  Enabled: false
RSpec/NestedGroups:
  Enabled: false
RSpec/IdenticalEqualityAssertion:
  Enabled: false
RSpec/LetSetup:
  Enabled: false
RSpec/IteratedExpectation:
  Enabled: false
RSpec/ExpectActual:
  Enabled: false
RSpec/ExpectInHook:
  Enabled: false
RSpec/AnyInstance:
  Enabled: false

# --- Naming ---

Naming/VariableNumber:
  Enabled: false

# --- Rails relaxations ---

Rails/SkipsModelValidations:
  Enabled: false
Rails/ReversibleMigration:
  Enabled: false
Rails/HasManyOrHasOneDependent:
  Enabled: false
Rails/I18nLocaleTexts:
  Enabled: false

# --- Lint relaxations ---

Lint/DuplicateBranch:
  Enabled: false
Lint/IneffectiveAccessModifier:
  Enabled: false
Lint/DuplicateElsifCondition:
  Enabled: false
Lint/EmptyConditionalBody:
  Enabled: false
# Lint/SSyntax cannot be disabled - kept for reference

# --- Metrics relaxations ---

Metrics/BlockNesting:
  Enabled: false

# --- Style relaxations ---

Style/OneClassPerFile:
  Enabled: false
